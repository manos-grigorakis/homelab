apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-vault-auth
  namespace: monitoring
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: grafana-role
    serviceAccount: kube-prometheus-stack-grafana # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-cred-secret
  namespace: monitoring
spec:
  vaultAuthRef: grafana-vault-auth
  mount: secret
  type: kv-v2
  path: apps/grafana/admin
  refreshAfter: 1m
  destination:
    create: true
    name: grafana-cred-secret

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-authentik-secret
  namespace: monitoring
spec:
  vaultAuthRef: grafana-vault-auth
  mount: secret
  type: kv-v2
  path: apps/grafana/oauth
  refreshAfter: 60m
  destination:
    create: true
    name: grafana-authentik-secret
