apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: nextcloud-vault-auth
  namespace: nextcloud
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: nextcloud-role
    serviceAccount: nextcloud-serviceaccount # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
spec:
  vaultAuthRef: nextcloud-vault-auth
  mount: secret
  type: kv-v2
  path: apps/nextcloud
  refreshAfter: 60s
  destination:
    create: true
    name: nextcloud-secrets
