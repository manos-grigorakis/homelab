apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.poolnode.net`)
      kind: Rule
      services:
        - name: nextcloud
          port: 8080
  tls:
    secretName: poolnode-wildcard-tls
