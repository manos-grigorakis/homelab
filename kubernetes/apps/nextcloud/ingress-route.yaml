apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cloud.poolnode.net`)
      kind: Rule
      services:
        - name: nextcloud
          port: 8080
  tls:
    secretName: poolnode-wildcard-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-collabora
  namespace: nextcloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`office.poolnode.net`)
      kind: Rule
      services:
        - name: nextcloud-collabora
          port: 9980
  tls:
    secretName: poolnode-wildcard-tls
