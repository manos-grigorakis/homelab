apiVersion: v1
kind: PersistentVolume
metadata:
  name: surveillance-pv
spec:
  capacity:
    storage: 10.77Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.2 # NFS Version
    - rsize=1048576 # Buffer 1MiB
    - wsize=1048576 # Buffer 1MiB
    - hard
    - timeo=600 # Timeout 60s
    - retrans=2 # Retries
  nfs:
    server: 192.168.10.100
    path: /mnt/tank/services/surveillance

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surveillance-pvc
  namespace: frigate
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10.77Ti
  volumeName: surveillance-pv
