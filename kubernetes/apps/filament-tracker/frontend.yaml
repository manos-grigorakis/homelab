apiVersion: apps/v1
kind: Deployment
metadata:
  name: filament-tracker-frontend
  namespace: filament-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filament-tracker-frontend
  template:
    metadata:
      labels:
        app: filament-tracker-frontend
    spec:
      containers:
        - name: frontend
          image: manosgrigorakis/filament-tracker-frontend@sha256:725269f09e84036643ddd36f0e2f705c2df05a0e03b8c37232dc12abefec329d
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "250m"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: filament-tracker-frontend-config
