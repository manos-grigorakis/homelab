apiVersion: v1
kind: Service
metadata:
  name: filament-tracker-backend
  namespace: filament-tracker
spec:
  selector:
    app: filament-tracker-backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: filament-tracker-frontend
  namespace: filament-tracker
spec:
  selector:
    app: filament-tracker-frontend
  ports:
    - port: 80
      targetPort: 80
