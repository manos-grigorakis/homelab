apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  destination:
    namespace: nextcloud
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.2.6
      helm:
        valueFiles:
          - $values/kubernetes/apps/nextcloud/values.yaml

    - repoURL: https://github.com/manos-grigorakis/homelab.git
      targetRevision: feat/nextcloud
      path: kubernetes/apps/nextcloud
      ref: values
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
