apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.2.2
      helm:
        valueFiles:
          - $values/kubernetes/apps/authentik/values.yaml

    - repoURL: https://github.com/manos-grigorakis/homelab.git
      targetRevision: main
      path: kubernetes/apps/authentik
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
