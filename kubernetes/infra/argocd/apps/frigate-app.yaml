apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate
  namespace: argocd
spec:
  destination:
    namespace: frigate
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://blakeblackshear.github.io/blakeshome-charts/
      chart: frigate
      targetRevision: 7.8.0
      helm:
        valueFiles:
          - $values/kubernetes/apps/frigate/values.yaml
        fileParameters:
          - name: config
            path: config.yaml

    - repoURL: https://github.com/manos-grigorakis/homelab.git
      targetRevision: main
      path: kubernetes/apps/frigate
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
