apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
spec:
  destination:
    namespace: vault-secrets-operator
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 1.5.0
      helm:
        valueFiles:
          - $values/kubernetes/infra/vault-secrets-operator/values.yaml

    - repoURL: https://github.com/manos-grigorakis/homelab.git
      targetRevision: main
      path: kubernetes/infra/vault-secrets-operator
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
