apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  destination:
    namespace: vault
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.0
      helm:
        valueFiles:
          - $values/k3s/infra/vault/values.yaml

    - repoURL: https://github.com/manos-grigorakis/homelab.git
      targetRevision: main
      path: k3s/infra/vault
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
