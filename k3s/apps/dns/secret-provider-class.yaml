apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dns-secret-provider-class
  namespace: dns
spec:
  provider: vault
  secretObjects:
    - data:
        - key: FTLCONF_WEBSERVER_API_PASSWORD
          objectName: FTLCONF_WEBSERVER_API_PASSWORD
      secretName: dns-secret
      type: Opaque
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "dns-role"
    objects: |
      - objectName: "FTLCONF_WEBSERVER_API_PASSWORD"
        secretPath: "secret/data/apps/pi-hole"
        secretKey: "password"
