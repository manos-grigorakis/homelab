apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: n8n-vault-auth
  namespace: n8n
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: n8n-role
    serviceAccount: n8n # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: n8n-secret
  namespace: n8n
spec:
  vaultAuthRef: n8n-vault-auth
  mount: secret
  type: kv-v2
  path: apps/n8n
  refreshAfter: 60s
  destination:
    create: true
    name: n8n-secret
