apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: alert-manager-vault-auth
  namespace: monitoring
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: alert-manager-role
    serviceAccount: kube-prometheus-stack-alertmanager # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-smtp-secret
  namespace: monitoring
spec:
  vaultAuthRef: alert-manager-vault-auth
  mount: secret
  type: kv-v2
  path: apps/alert-manager
  refreshAfter: 5m
  destination:
    create: true
    name: alertmanager-smtp
