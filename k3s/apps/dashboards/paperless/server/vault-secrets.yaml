apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-service-account
  namespace: paperless
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: paperless-vault-auth
  namespace: paperless
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: paperless-role
    serviceAccount: paperless-service-account

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-secret
  namespace: paperless
spec:
  vaultAuthRef: paperless-vault-auth
  mount: secret
  type: kv-v2
  path: apps/paperless
  refreshAfter: 60s
  destination:
    create: true
    name: paperless-secret
