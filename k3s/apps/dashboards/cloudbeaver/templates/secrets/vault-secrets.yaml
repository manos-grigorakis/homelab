apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudbeaver-service-account
  namespace: cloudbeaver

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cloudbeaver-vault-auth
  namespace: cloudbeaver
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cloudbeaver-role
    serviceAccount: cloudbeaver-service-account

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudbeaver-secret
  namespace: cloudbeaver
spec:
  vaultAuthRef: cloudbeaver-vault-auth
  mount: secret
  type: kv-v2
  path: apps/cloudbeaver
  refreshAfter: 60s
  destination:
    create: true
    name: cloudbeaver-secret
