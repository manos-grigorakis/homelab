apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: homarr-vault-auth
  namespace: homarr
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: homarr-role
    serviceAccount: homarr-sa # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homarr-secret
  namespace: homarr
spec:
  vaultAuthRef: homarr-vault-auth
  mount: secret
  type: kv-v2
  path: apps/homarr
  refreshAfter: 60s
  destination:
    create: true
    name: homarr-secret
