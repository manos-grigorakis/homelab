apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      serviceAccountName: mealie-service-account
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "1000Mi"
              cpu: "1"
          ports:
            - containerPort: 9000
              name: mealie
          envFrom:
            - configMapRef:
                name: mealie-configmap
            - secretRef:
                name: mealie-secret
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-pvc
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "mealie-secret-provider-class"
