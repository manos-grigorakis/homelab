apiVersion: v1
kind: ServiceAccount
metadata:
  name: mealie-service-account
  namespace: mealie

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mealie-vault-auth
  namespace: mealie
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mealie-role
    serviceAccount: mealie-service-account

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: mealie
  name: mealie-secret
spec:
  vaultAuthRef: mealie-vault-auth
  mount: secret
  type: kv-v2
  path: apps/mealie
  version: 2
  refreshAfter: 60s
  destination:
    create: true
    name: mealie-secret
