apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mealie-secret-provider-class
  namespace: mealie
spec:
  provider: vault
  secretObjects:
    - data:
        - key: OIDC_CLIENT_SECRET
          objectName: OIDC_CLIENT_SECRET
      secretName: mealie-secret
      type: Opaque
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "mealie-role"
    objects: |
      - objectName: "OIDC_CLIENT_SECRET"
        secretPath: "secret/data/apps/mealie"
        secretKey: "OIDC_CLIENT_SECRET"
