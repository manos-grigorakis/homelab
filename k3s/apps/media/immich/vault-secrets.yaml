apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-service-account
  namespace: immich

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: immich-vault-auth
  namespace: immich
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: immich-role
    serviceAccount: immich-service-account

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-secret
  namespace: immich
spec:
  vaultAuthRef: immich-vault-auth
  mount: secret
  type: kv-v2
  path: apps/immich
  refreshAfter: 60s
  destination:
    create: true
    name: immich-secret
