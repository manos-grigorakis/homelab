apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mariadb-secret-provider-class
  namespace: databases
spec:
  provider: vault
  secretObjects:
    - data:
        - key: MARIADB_ROOT_PASSWORD
          objectName: MARIADB_ROOT_PASSWORD
      secretName: mariadb-secret
      type: Opaque
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "mariadb-role"
    objects: |
      - objectName: "MARIADB_ROOT_PASSWORD"
        secretPath: "secret/data/apps/databases/mariadb"
        secretKey: "ROOT_PASSWORD"
