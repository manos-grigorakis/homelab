apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-secret-provider-class
  namespace: databases
spec:
  provider: vault
  secretObjects:
    - data:
        - key: MYSQL_ROOT_PASSWORD
          objectName: MYSQL_ROOT_PASSWORD
      secretName: mysql-secret
      type: Opaque
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "mysql-role"
    objects: |
      - objectName: "MYSQL_ROOT_PASSWORD"
        secretPath: "secret/data/apps/databases/mysql"
        secretKey: "ROOT_PASSWORD"
