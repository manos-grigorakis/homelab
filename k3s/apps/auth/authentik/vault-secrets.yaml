apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: authentik-vault-auth
  namespace: authentik
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: authentik-role
    serviceAccount: authentik # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-secret
  namespace: authentik
spec:
  vaultAuthRef: authentik-vault-auth
  mount: secret
  type: kv-v2
  path: apps/authentik
  refreshAfter: 60s
  destination:
    create: true
    name: authentik-secret
