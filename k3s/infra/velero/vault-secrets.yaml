apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: velero-vault-auth
  namespace: velero
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: velero-role
    serviceAccount: velero-server # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  vaultAuthRef: velero-vault-auth
  mount: secret
  type: kv-v2
  path: infra/velero/credentials
  refreshAfter: 1h
  destination:
    create: true
    name: velero-credentials
