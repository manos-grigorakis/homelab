apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cert-manager-vault-auth
  namespace: cert-manager
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cert-manager-role
    serviceAccount: cert-manager # Auto-generated from Helm chart

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  vaultAuthRef: cert-manager-vault-auth
  mount: secret
  type: kv-v2
  path: infra/cert-manager/issuer-secret
  refreshAfter: 24h
  destination:
    create: true
    name: cloudflare-api-token-secret
