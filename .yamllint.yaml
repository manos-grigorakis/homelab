extends: default

yaml-files:
  - "**/*.yaml"
  - "**/*.yml"
  - ".yamllint"

ignore: |
  kubernetes/apps/cloudbeaver/templates/

rules:
  document-start: disable
  line-length:
    max: 150
    level: warning
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
